<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوالفنا - Sawalefna LiveKit Suite</title>
    <!-- مكتبة LiveKit العميل للبث الصوتي -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        .app-header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
        }
        .app-header h1 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--accent-color);
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .profile-card {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            background: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .input-group {
            margin-bottom: 8px;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .input-group input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
            color: #fff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            font-size: 0.9rem;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .chat-box {
            height: 110px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-message {
            padding: 6px 8px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 6px;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1>🎙️ منصة سوالفنا (Sawalefna)</h1>
    </div>

    <div class="content-area">
        <!-- قسم الهوية وتوليد الـ ID -->
        <div class="section">
            <div class="profile-card">
                <div class="avatar-box" id="avatarPreviewContainer">
                    <span>👤</span>
                </div>
                <div>
                    <h3 id="displayNickname" style="margin:0; font-size:1rem;">زائر جديد</h3>
                    <span id="displayId" style="font-size:0.75rem; color:var(--accent-color);">ID: جاري التوليد...</span>
                </div>
            </div>
            <div style="margin-top: 12px;">
                <div class="input-group">
                    <label>الاسم المستعار:</label>
                    <input type="text" id="nicknameInput" placeholder="أدخل اسمك المستعار...">
                </div>
                <div class="input-group">
                    <label>رابط الصورة الشخصية (URL):</label>
                    <input type="text" id="avatarInput" placeholder="https://...">
                </div>
                <button class="btn" onclick="saveProfile()">حفظ الهوية وتحديث الـ ID</button>
            </div>
        </div>

        <!-- قسم الصوت الحي عبر LiveKit -->
        <div class="section" style="padding: 12px 14px;">
            <h4 style="margin:0 0 8px 0; font-size: 0.9rem;">غرفة الاتصال الصوتي</h4>
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem;">
                <span id="voiceStatus" style="color: #94a3b8;">غير متصل بالصوت</span>
                <button class="btn" id="voiceToggleBtn" onclick="toggleVoiceRoom()" style="width: auto; padding: 6px 14px; background: #10b981; color: #fff;">انضمام للصوت</button>
            </div>
        </div>

        <!-- قسم الدردشة الحية -->
        <div class="section" style="margin-bottom: 0;">
            <h4 style="margin:0 0 8px 0; font-size: 0.9rem;">الدردشة العامة</h4>
            <div class="chat-box" id="chatBox">
                <div class="chat-message"><b>النظام:</b> أهلاً بك في غرفة سوالفنا.</div>
            </div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:#fff; font-size:0.85rem;">
                <button class="btn" style="width: auto;" onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>
</div>

<script>
    // رابط خادم LiveKit الخاص بك
    const LIVEKIT_URL = 'wss://aboudswo-p_6ok8wbymhk.livekit.cloud';
    // عنوان سيرفر بايثون المحلي (Termux) لجلب التوكنات أوتوماتيكياً
    const TOKEN_SERVER_URL = 'http://localhost:8080/get-token';

    // إدارة هوية الضيف والـ ID الفريد
    let currentUser = JSON.parse(localStorage.getItem('sawalefna_profile')) || {
        id: 'SW-' + Math.floor(100000 + Math.random() * 900000),
        nickname: 'ضـيف_' + Math.floor(Math.random() * 900),
        avatar: ''
    };

    let room = null;
    let isConnectedToVoice = false;

    function initApp() {
        document.getElementById('nicknameInput').value = currentUser.nickname;
        document.getElementById('avatarInput').value = currentUser.avatar;
        updateUI();
    }

    function updateUI() {
        document.getElementById('displayNickname').innerText = currentUser.nickname;
        document.getElementById('displayId').innerText = 'ID: ' + currentUser.id;
        
        const avatarContainer = document.getElementById('avatarPreviewContainer');
        if (currentUser.avatar) {
            avatarContainer.innerHTML = `<img src="${currentUser.avatar}" alt="Avatar" onerror="this.onerror=null; this.parentNode.innerHTML='👤';">`;
        } else {
            avatarContainer.innerHTML = `<span>👤</span>`;
        }
    }

    function saveProfile() {
        const nick = document.getElementById('nicknameInput').value.trim();
        const avatarUrl = document.getElementById('avatarInput').value.trim();

        if (nick) currentUser.nickname = nick;
        currentUser.avatar = avatarUrl;

        localStorage.setItem('sawalefna_profile', JSON.stringify(currentUser));
        updateUI();
        alert('تم حفظ الهوية وتحديث الـ ID بنجاح!');
    }

    // --- نظام الاتصال الصوتي التلقائي عبر LiveKit وسيرفر التوكنات ---
    async function toggleVoiceRoom() {
        const statusEl = document.getElementById('voiceStatus');
        const btnEl = document.getElementById('voiceToggleBtn');

        if (!isConnectedToVoice) {
            try {
                statusEl.innerText = "جاري جلب التوكن والاتصال...";
                
                // طلب توكن أمني فريد لهذا الضيف من سيرفر بايثون المحلي
                const response = await fetch(`${TOKEN_SERVER_URL}?room=sawalefna-room&id=${currentUser.id}&name=${encodeURIComponent(currentUser.nickname)}`);
                const data = await response.json();

                if (!data.token) {
                    throw new Error("فشل في استخراج التوكن من السيرفر");
                }

                room = new LivekitClient.Room({
                    audioCaptureDefaults: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                    },
                });

                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LivekitClient.Track.Kind.Audio) {
                        const audioElement = track.attach();
                        document.body.appendChild(audioElement);
                    }
                });

                // الاتصال بغرفة LiveKit بالتوكن الخاص بالضيف
                await room.connect(LIVEKIT_URL, data.token);
                await room.localParticipant.enableMicrophone();

                isConnectedToVoice = true;
                statusEl.innerText = "متصل بالغرفة الصوتية 🟢";
                statusEl.style.color = "#10b981";
                btnEl.innerText = "مغادرة الصوت";
                btnEl.style.background = "#ef4444";

            } catch (error) {
                console.error(error);
                statusEl.innerText = "خطأ في الاتصال (تأكد من تشغيل سيرفر بايثون)";
                statusEl.style.color = "#ef4444";
            }
        } else {
            if (room) {
                room.disconnect();
            }
            isConnectedToVoice = false;
            statusEl.innerText = "غير متصل بالصوت";
            statusEl.style.color = "#94a3b8";
            btnEl.innerText = "انضمام للصوت";
            btnEl.style.background = "#10b981";
        }
    }

    // --- نظام الدردشة الفورية ---
    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-message';
        msgDiv.innerHTML = `<b>${currentUser.nickname} (${currentUser.id}):</b> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        input.value = '';
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendChatMessage();
    }

    window.onload = initApp;
</script>

</body>
</html>
