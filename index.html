<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوالفنا | Sawalefna</title>
    <!-- FontAwesome للأيقونات -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f11;
            --bg-card: #18181c;
            --purple-main: #1a0b2e;
            --accent-gold: #d4af37;
            --text-color: #ffffff;
            --text-sub: #a0a0ab;
            --border-color: #2a2a30;
        }

        /* الوضع الفاتح */
        body.light-theme {
            --bg-primary: #f4f4f7;
            --bg-card: #ffffff;
            --purple-main: #4a2c82;
            --accent-gold: #b8860b;
            --text-color: #111111;
            --text-sub: #666666;
            --border-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px;
            transition: all 0.3s ease;
        }

        /* الهيدر العلوي */
        header {
            background: linear-gradient(180deg, var(--purple-main) 0%, var(--bg-primary) 100%);
            padding: 18px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--accent-gold);
            font-size: 20px;
            cursor: pointer;
        }

        .container { padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        /* التبويبات */
        .page-section { display: none; }
        .page-section.active { display: block; }

        /* كروت الغرف الصوتية */
        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .join-btn {
            background: linear-gradient(45deg, var(--accent-gold), #aa7c11);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* شاشة الغرفة الصوتية والمقاعد */
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .avatar-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #2a2a30;
            border: 2px solid var(--accent-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: var(--accent-gold);
        }

        .mic-status {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: green;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* شريط التحكم السفلي في الغرفة */
        .voice-controls {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .ctrl-btn {
            background: #25252b;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: var(--accent-gold);
            font-size: 18px;
            cursor: pointer;
        }

        .ctrl-btn.active {
            background: var(--accent-gold);
            color: #000;
        }

        /* القائمة السفلية للتنقل */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-gold); }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo-title"><i class="fas fa-comments"></i> سوالفنا</div>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </header>

    <div class="container">
        
        <!-- صفحة الرئيسية والغرف -->
        <div id="home" class="page-section active">
            <h3 style="margin-bottom: 10px;">الغرف المباشرة</h3>
            
            <div class="room-card">
                <div>
                    <h4>مجلس السمر والأنس</h4>
                    <p style="font-size: 12px; color: var(--text-sub);"><i class="fas fa-users"></i> 18 متواجد الآن</p>
                </div>
                <button class="join-btn" onclick="openRoom('مجلس السمر والأنس')">دخول</button>
            </div>

            <div class="room-card">
                <div>
                    <h4>ديوانية الشكولاتة والسوالف</h4>
                    <p style="font-size: 12px; color: var(--text-sub);"><i class="fas fa-users"></i> 32 متواجد الآن</p>
                </div>
                <button class="join-btn" onclick="openRoom('ديوانية الشكولاتة')">دخول</button>
            </div>
        </div>

        <!-- واجهة الغرفة الصوتية المباشرة -->
        <div id="roomView" class="page-section">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="currentRoomTitle">اسم الغرفة</h3>
                <button onclick="leaveRoom()" style="background:red; color:#fff; border:none; padding:5px 12px; border-radius:10px;">خروج</button>
            </div>

            <!-- المقاعد الصوتية (8 مقاعد) -->
            <div class="seats-grid">
                <div class="seat">
                    <div class="avatar-box"><i class="fas fa-user-crown"></i><div class="mic-status"><i class="fas fa-mic"></i></div></div>
                    <span style="font-size: 11px;">الآدمين</span>
                </div>
                <div class="seat">
                    <div class="avatar-box"><i class="fas fa-user"></i><div class="mic-status" style="background:gray;"><i class="fas fa-mic-slash"></i></div></div>
                    <span style="font-size: 11px;">عبود</span>
                </div>
                <!-- 6 مقاعد فارغة -->
                <script>
                    for(let i=3; i<=8; i++){
                        document.write(`
                            <div class="seat">
                                <div class="avatar-box" style="border:1px dashed #555; color:#555;"><i class="fas fa-plus"></i></div>
                                <span style="font-size: 11px; color:#666;">مقعد ${i}</span>
                            </div>
                        `);
                    }
                </script>
            </div>

            <!-- أزرار التحكم بالصوت -->
            <div class="voice-controls">
                <button class="ctrl-btn" id="micBtn" onclick="toggleMic()"><i class="fas fa-microphone-slash"></i></button>
                <button class="ctrl-btn" onclick="alert('تم رفع اليد لطلب التحدث!')"><i class="fas fa-hand"></i></button>
                <button class="ctrl-btn" onclick="alert('قسم الهدايا الافتراضية قريباً!')"><i class="fas fa-gift"></i></button>
            </div>
        </div>

        <!-- صفحة اكتشف -->
        <div id="explore" class="page-section">
            <h3>اكتشف الاهتمامات</h3>
            <p style="color: var(--text-sub); margin-top: 10px;">ابحث عن الغرف والأصدقاء حسب الاهتمام.</p>
        </div>

        <!-- صفحة الرسائل -->
        <div id="messages" class="page-section">
            <h3>الرسائل الخاصة</h3>
            <p style="color: var(--text-sub); margin-top: 10px;">لا توجد محادثات جديدة حالياً.</p>
        </div>

        <!-- صفحة الملف الشخصي -->
        <div id="profile" class="page-section">
            <div style="text-align: center; margin-top: 20px;">
                <div class="avatar-box" style="width: 80px; height: 80px; margin: 0 auto; font-size: 30px;">
                    <i class="fas fa-user"></i>
                </div>
                <h3 style="margin-top: 10px;">عبود</h3>
                <p style="color: var(--accent-gold); font-size: 14px;">المستوى: VIP ⭐️</p>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-home"></i>الرئيسية</div>
        <div class="nav-item" onclick="switchTab('explore', this)"><i class="fas fa-compass"></i>اكتشف</div>
        <div class="nav-item" onclick="switchTab('messages', this)"><i class="fas fa-comment-dots"></i>الرسائل</div>
        <div class="nav-item" onclick="switchTab('profile', this)"><i class="fas fa-user"></i>حسابي</div>
    </nav>

    <script>
        let isMicOn = false;

        function switchTab(tabId, element) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        function openRoom(title) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('roomView').classList.add('active');
            document.getElementById('currentRoomTitle').innerText = title;
        }

        function leaveRoom() {
            switchTab('home', document.querySelectorAll('.nav-item')[0]);
        }

        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            const icon = btn.querySelector('i');
            
            if (!isMicOn) {
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    isMicOn = true;
                    btn.classList.add('active');
                    icon.className = 'fas fa-microphone';
                } catch (err) {
                    alert('يرجى السماح بالوصول للميكروفون للتحدث.');
                }
            } else {
                isMicOn = false;
                btn.classList.remove('active');
                icon.className = 'fas fa-microphone-slash';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }
    </script>
</body>
</html>
